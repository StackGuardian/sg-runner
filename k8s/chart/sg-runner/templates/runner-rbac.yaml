{{- if .Values.runner.nativeSteps.enabled }}
{{- $name := include "sg-runner.runnerName" . }}
{{- $component := dict "ctx" . "component" "runner" }}
# The steps broker's identity (native steps). Only the broker container mounts
# a token for it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "sg-runner.labels" $component | nindent 4 }}
automountServiceAccountToken: false
---
# Step pods and their Secrets in the release namespace. Secrets are write
# only: the broker never reads them back (they hold the steps' env and
# registry credentials), so a leaked token can't list the namespace's Secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "sg-runner.labels" $component | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  # Step output, for the run controllers.
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "sg-runner.labels" $component | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
{{- end }}
