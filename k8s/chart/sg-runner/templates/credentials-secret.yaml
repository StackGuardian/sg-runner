{{- $name := include "sg-runner.credentialsSecretName" . }}
{{- if .Values.credentials.create }}
# The runner group's node token, the only secret. Mounted as a file named
# SG_NODE_TOKEN, next to the runner group ConfigMap's keys.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "sg-runner.labels" (dict "ctx" . "component" "runner") | nindent 4 }}
type: Opaque
stringData:
  SG_NODE_TOKEN: {{ required "credentials.nodeToken is required with credentials.create=true" .Values.credentials.nodeToken | quote }}
{{- end }}
