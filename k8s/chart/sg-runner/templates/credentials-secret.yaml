{{- $name := include "sg-runner.credentialsSecretName" . }}
{{- if .Values.credentials.create }}
{{- $c := .Values.credentials }}
# SG credentials, one file per key when mounted: runner.sh and scaler.sh read
# these names.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "sg-runner.labels" (dict "ctx" . "component" "runner") | nindent 4 }}
type: Opaque
stringData:
  SG_NODE_TOKEN: {{ required "credentials.nodeToken is required with credentials.create=true" $c.nodeToken | quote }}
  SG_ORGANIZATION: {{ required "credentials.organization is required with credentials.create=true" $c.organization | quote }}
  SG_RUNNER_GROUP: {{ required "credentials.runnerGroup is required with credentials.create=true" $c.runnerGroup | quote }}
  {{- with $c.apiUrl }}
  SG_BASE_API: {{ . | quote }}
  {{- end }}
{{- end }}
