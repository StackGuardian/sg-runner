{{- if and .Values.scaler.enabled .Values.scaler.metrics.enabled }}
{{- $m := .Values.scaler.metrics }}
{{- $component := dict "ctx" . "component" "scaler" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sg-runner.scalerName" . }}-metrics
  labels:
    {{- include "sg-runner.labels" $component | nindent 4 }}
spec:
  selector:
    {{- include "sg-runner.selectorLabels" $component | nindent 4 }}
  ports:
    - { name: metrics, port: {{ $m.port }}, targetPort: metrics, protocol: TCP }
{{- if and $m.serviceMonitor.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1/ServiceMonitor") }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "sg-runner.scalerName" . }}
  labels:
    {{- include "sg-runner.labels" $component | nindent 4 }}
    {{- with $m.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "sg-runner.selectorLabels" $component | nindent 6 }}
  endpoints:
    - port: metrics
      interval: {{ $m.serviceMonitor.interval }}
{{- end }}
{{- end }}
