{{- if .Values.scaler.enabled }}
{{- $name := include "sg-runner.scalerName" . }}
{{- $sts := include "sg-runner.runnerName" . }}
{{- $component := dict "ctx" . "component" "scaler" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "sg-runner.labels" $component | nindent 4 }}
---
# Only the runner StatefulSet's scale, PVCs and reap Jobs. Runner pods get no
# Kubernetes API access at all.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "sg-runner.labels" $component | nindent 4 }}
rules:
  # Read replicas; patch for the scaler's timer annotations.
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    resourceNames: [{{ $sts | quote }}]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["statefulsets/scale"]
    resourceNames: [{{ $sts | quote }}]
    verbs: ["get", "patch"]
  # Parked-at stamps, and deleting a reaped runner's PVCs.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["list", "get", "patch", "delete"]
  # Reap Jobs deregister long-parked runners from their PVC.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "delete"]
  # Scaling decisions as Kubernetes events.
  - apiGroups: ["", "events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "sg-runner.labels" $component | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
{{- end }}
