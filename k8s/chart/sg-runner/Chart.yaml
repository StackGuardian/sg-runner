apiVersion: v2
name: sg-runner
description: StackGuardian Private Runner on Kubernetes (prototype). Each StatefulSet replica is one registered runner.
type: application
# Chart version, bumped on every chart change.
version: 0.9.0
# `dev` is for local builds (`make build`). The release workflow packages the
# chart with the release's version (the `k8s/v*` tag without its prefix) as
# both version and appVersion. Used as the image tag when image.tag is empty.
appVersion: "dev"
# The steps broker is a native sidecar (init container with restartPolicy
# Always).
kubeVersion: ">=1.29.0-0"
keywords:
  - stackguardian
  - runner
home: https://github.com/StackGuardian/sg-runner
